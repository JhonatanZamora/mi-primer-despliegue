
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mi primera aplicación desplegada con Dokploy">
    <title>Mi primer despliegue</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="card">
            <span class="tag">MI PRIMER PROYECTO</span>

            <h1>¡Hola, mundo!</h1>

            <p class="subtitle">
                Mi primera aplicación web desplegada con
                GitHub, Dokploy y Docker Swarm.
            </p>

            <div class="status">
                <span class="status-dot"></span>
                Aplicación en funcionamiento
            </div>

            <button id="messageButton">
                Haz clic aquí
            </button>

            <p id="message" aria-live="polite">
                ¡Bienvenido a mi primer despliegue!
            </p>

            <footer>
                Desarrollado como práctica de infraestructura
                de comunicaciones.
            </footer>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
